<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Premium Golden Gradient -->
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#805b00" />
    </linearGradient>
    
    <!-- Subtle Inner Glow / Shadow Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c1c" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>
  </defs>

  <!-- Luxury Circular Dark Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-glow)" stroke="url(#gold-gradient)" stroke-width="12" />

  <!-- Monogram & Scissors Stylized Shape -->
  <g transform="translate(0, 0)">
    <!-- Elegant Outer Scissor Loop Left -->
    <circle cx="200" cy="330" r="45" fill="none" stroke="url(#gold-gradient)" stroke-width="16" />
    <!-- Elegant Outer Scissor Loop Right -->
    <circle cx="312" cy="330" r="45" fill="none" stroke="url(#gold-gradient)" stroke-width="16" />
    
    <!-- Scissor Blades meeting to form 'S' & 'C' curves -->
    <!-- Left Scissor Shank / Blade -->
    <path d="M200 285 L256 190 L256 120" stroke="url(#gold-gradient)" stroke-width="16" stroke-linecap="round" fill="none" />
    <!-- Right Scissor Shank / Blade -->
    <path d="M312 285 L256 190 L256 120" stroke="url(#gold-gradient)" stroke-width="16" stroke-linecap="round" fill="none" />

    <!-- Center Pivot Gem -->
    <circle cx="256" cy="205" r="10" fill="#ffffff" stroke="url(#gold-gradient)" stroke-width="4" />
    
    <!-- Abstract Stylized Hair Swirl / Elegant Ribbon forming the 'C' -->
    <path d="M160 160 C 200 90, 312 90, 352 160 C 370 190, 370 240, 340 280" fill="none" stroke="url(#gold-gradient)" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
